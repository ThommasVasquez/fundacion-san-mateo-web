name = "fsm-web-app"
main = ".open-next/worker.js"
compatibility_date = "2024-11-20"
compatibility_flags = ["nodejs_compat"]
assets = { directory = ".open-next/assets", binding = "ASSETS" }


[vars]
NODE_VERSION = "22.16.0"
# DATABASE_URL y JWT_SECRET vivian aqui, en claro, en un repositorio publico:
# la contrasena de la base del colegio y la clave con la que se firman las
# sesiones, cualquiera podia leerlas. Ahora son secrets de Cloudflare, que no
# viajan en el codigo:
#
#   npx wrangler secret put DATABASE_URL
#   npx wrangler secret put JWT_SECRET
#
# Las que estuvieron publicadas ya estan rotadas; siguen en el historial de git,
# pero no abren nada. Nada que sea un secreto vuelve a este fichero.

[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "fsm-images"
